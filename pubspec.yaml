name: entry_book
description: Android-only account management app with GetX and GetStorage.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  get_storage: ^2.1.1
  excel: ^4.0.6
  csv: ^6.0.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  intl: ^0.19.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
